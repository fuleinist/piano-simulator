name: Deploy to Cloudflare

# Keeps the published site in step with main: every push to main runs the
# tests, builds the bundle, and deploys dist/ to the piano-simulator Worker.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push cancels a deploy that has not started yet,
# so the site never ends up on an older commit than the branch.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # wrangler comes from devDependencies, so CI runs the version the
      # lockfile pins rather than whatever is newest.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}